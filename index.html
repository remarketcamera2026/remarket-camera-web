<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>리마켓 바코드카메라</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}body{min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 15px 10px;gap:8px}.top strong{font-size:19px}.top small{font-size:12px;text-align:right}.tools{display:flex;align-items:center;justify-content:space-between;background:#222;padding:9px 14px;gap:8px}.tools button{background:transparent;color:white;border:0;font-size:14px;font-weight:700;padding:6px}.tools #account{font-size:11px;color:#ddd;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame{position:relative;width:100%;aspect-ratio:3/4;max-height:67dvh;background:#080808;overflow:hidden}.frame video{width:100%;height:100%;object-fit:cover;display:block}.overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column}.scanbox{width:82%;height:115px;border:3px solid white;border-radius:14px}.tip{margin-top:12px;padding:7px 12px;background:#0009;border-radius:8px;font-weight:700;font-size:14px}.photoTip{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 5px #000}.actions{position:absolute;bottom:16px;left:20px;right:20px;display:flex;flex-direction:column;gap:10px}.actions button{border:0;border-radius:13px;padding:15px;font-weight:800;font-size:18px}.shoot{background:white;color:#111}.secondary{background:#000b;color:#fff;border:1px solid #fff!important;font-size:14px!important;padding:10px!important;align-self:flex-end}.bottom{background:#111;padding:15px 18px;min-height:110px}.label{font-size:13px;color:#bbb}.number{font-size:28px;font-weight:800;margin-top:3px}.message{color:#ccc;font-size:13px;margin-top:9px;overflow-wrap:anywhere}.error{color:#ffb3b3}.settings{display:none;background:#252525;padding:14px}.settings input{width:100%;padding:11px;font-size:14px;margin:6px 0}.settings button{padding:9px;border-radius:7px}.hidden{display:none!important}#preview{display:none}button:disabled{opacity:.5}
</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body>
<header class="top"><strong>리마켓 바코드카메라</strong><small id="count">완료 0장 / 대기 0장</small></header>
<div class="tools"><button id="login">구글 로그인</button><span id="account">로그인 전</span><button id="retry">재전송</button><button id="settingsButton" aria-label="설정">⚙</button></div>
<section id="settings" class="settings"><div>Google OAuth 웹 클라이언트 ID</div><input id="clientId" placeholder="...apps.googleusercontent.com"><button id="saveClient">설정 저장</button> <button id="logout">연결 해제</button></section>
<main class="frame"><video id="video" autoplay muted playsinline></video><div id="scanOverlay" class="overlay"><div class="scanbox"></div><div class="tip">바코드를 이 안에 맞춰 주세요</div></div><div id="photoOverlay" class="hidden"><div class="photoTip">이 화면 전체가 저장되는 사진 범위입니다</div><div class="actions"><button id="rescan" class="secondary">바코드 다시 읽기</button><button id="shoot" class="shoot">상품 사진 촬영</button><button id="next" class="secondary">다음 상품</button></div></div></main>
<footer class="bottom"><div class="label">제품번호</div><div class="number" id="number">바코드를 보여 주세요</div><div class="message" id="status">카메라를 준비하고 있습니다.</div></footer><canvas id="canvas" class="hidden"></canvas><script src="app.js?v=android-style-1"></script></body></html>
