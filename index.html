<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>리마켓 카메라</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:12px;max-width:620px;margin-inline:auto}h2{margin:5px 0 10px;font-size:20px}.panel{background:#253145;padding:12px;border-radius:12px;margin:9px 0}button,input{font:inherit}button{border:0;border-radius:10px;background:#f1bb60;color:#141414;font-weight:700;padding:13px;cursor:pointer}button:disabled{opacity:.4}button.primary{font-size:22px;width:100%;padding:17px}.row{display:flex;gap:8px}.row button{flex:1}.muted{color:#cbd3df;font-size:13px}#cameraBox{position:relative;width:100%;height:min(52vh,440px);min-height:250px;overflow:hidden;border-radius:14px;background:#000}video{display:block;width:100%;height:100%;object-fit:cover}#guide{position:absolute;top:50%;left:8%;width:84%;height:25%;transform:translateY(-50%);border:3px solid #ffd174;border-radius:9px;pointer-events:none}#guide:after{content:'바코드를 가로로 맞춰 주세요';position:absolute;bottom:-29px;left:0;right:0;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}#number{font-size:25px;font-weight:800;letter-spacing:1px}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#f1dcb5;font-size:14px}#clientId{width:100%;padding:10px;border-radius:8px;margin:6px 0}#setup{display:none}#capture,#next{display:none}#preview{display:none;width:100%;max-height:250px;object-fit:contain;border-radius:8px;margin-top:8px}#account{overflow-wrap:anywhere}
</style><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script></head><body>
<h2>리마켓 바코드 카메라</h2><div class="panel"><div class="muted">구글 계정</div><div id="account">로그인 전</div><div class="row"><button id="login">구글 로그인</button><button id="settings">설정</button></div><div id="setup"><div class="muted">Google Cloud 웹 OAuth 클라이언트 ID</div><input id="clientId" placeholder="...apps.googleusercontent.com"><button id="saveClient">설정 저장</button><button id="logout">연결 해제</button></div></div>
<div id="cameraBox"><video id="video" autoplay muted playsinline></video><div id="guide"></div></div>
<div class="panel"><div class="muted">인식 번호</div><div id="number">대기 중</div><div class="muted" id="hint">9자리 숫자 / 9로 시작하면 10자리</div></div>
<button class="primary" id="start">바코드 스캔 시작</button><button class="primary" id="capture">📸 상품 사진 촬영</button><button class="primary" id="next">다음 상품 스캔</button><img id="preview" alt="촬영 사진"><div class="row" style="margin-top:8px"><button id="rescan">다시 스캔</button><button id="flush">대기 사진 재전송</button></div><div class="panel"><div id="count">전송 대기 0장</div><div id="status" aria-live="polite">로그인 후 바코드 스캔 시작을 누르세요.</div></div>
<script src="app.js?v=3"></script></body></html>
