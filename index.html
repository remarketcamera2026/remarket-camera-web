<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>리마켓 카메라</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:white;margin:0;padding:18px}h2{margin:6px 0 16px}button,input{font-size:16px;border-radius:9px;padding:12px;margin:5px 0}button{background:#e6b95c;border:0;color:#111;font-weight:bold}button:disabled{opacity:.45}input{box-sizing:border-box;width:100%}video{width:100%;max-height:48vh;background:#000;border-radius:12px}#status{white-space:pre-wrap;color:#ddd}small{color:#bbb}.panel{padding:12px;background:#253145;border-radius:12px;margin:12px 0}#number{font-size:25px;font-weight:bold;word-break:break-all}#preview{max-width:100%;max-height:220px}</style><script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script></head><body><h2>리마켓 바코드카메라</h2><div class="panel"><small>사진 저장 구글 계정</small><div id="account">로그인 전</div><button id="login">구글 로그인 / 계정 변경</button><button id="logout">연결 해제</button></div><div class="panel"><small>최초 설정: Google Cloud 웹 OAuth 클라이언트 ID</small><input id="clientId" placeholder="xxxxx.apps.googleusercontent.com"><button id="saveClient">설정 저장</button><small>웹사이트 주소를 승인된 JavaScript 원본으로 등록해야 합니다. HTTPS 필요.</small></div><video id="video" autoplay muted playsinline></video><button id="start">바코드 스캔 시작</button><button id="stop">카메라 중지</button><div class="panel"><small>인식 번호</small><div id="number">대기 중</div><button id="retry">다시 읽기</button><p><small>숫자 9자리, 9로 시작하면 10자리. 같은 번호 2회 확인.</small></p></div><div class="panel"><input type="file" id="photo" accept="image/*" capture="environment" disabled><img id="preview" alt=""><button id="send" disabled>사진 저장 및 전송</button><button id="flush">대기 사진 재전송</button><div id="count"></div></div><p id="status">웹앱 테스트 버전입니다.</p><script src="app.js"></script></body></html>
